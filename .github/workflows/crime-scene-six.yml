name: Crime Scene Six Auto Clipper

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test clipping without publishing"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: crime-scene-six-auto-clipper
  cancel-in-progress: false

jobs:
  clip-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the original clipping project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Find live clipping campaigns
        continue-on-error: true
        run: python scripts/campaigns.py

      - name: Run discovery and clipping
        run: python automation/runner.py

      - name: Plan edits with retention intelligence
        continue-on-error: true
        env:
          DB_PATH: automation/clip_intel.db
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/clip_intelligence.py plan-all

      - name: Watch clips and write captions (review first)
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: python scripts/watch_and_caption.py

      - name: Save clips and run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crime-scene-six-run-${{ github.run_number }}
          path: |
            artifacts/
            campaigns.md
            trends.md
            streams.md
            jobs/*/candidates.md
            jobs/*/edits/*.mp4
          if-no-files-found: ignore
          retention-days: 30

      - name: Save duplicate-prevention record
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          if [ -f automation/clip_intel.db ]; then git add automation/clip_intel.db; fi
          if [ -f automation/caption_history.json ]; then git add automation/caption_history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update auto-clip publishing record"
            git push
          fi
