name: Crime Scene Six Auto Clipper

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test clipping without publishing"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: crime-scene-six-auto-clipper
  cancel-in-progress: false

jobs:
  clip-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Get the original clipping project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run discovery, clipping and publishing
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: "1nFyqTryalnj57wRC3q75PZhiQdBDcFvN"
          FACEBOOK_PAGE_NAME: "CrimeScene VI"
          INSTAGRAM_USERNAME: "crimescene_vi"
          YOUTUBE_CHANNEL_NAME: "CrimeSceneVI"
          TIKTOK_USERNAME: "scurotwo8"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python automation/runner.py

      - name: Save clips and run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crime-scene-six-run-${{ github.run_number }}
          path: |
            artifacts/
            trends.md
            streams.md
            jobs/*/candidates.md
            jobs/*/edits/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Save duplicate-prevention record
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update auto-clip publishing record"
            git push
          fi
