name: Retention Loop

on:
  workflow_dispatch:
  schedule:
    - cron: "40 * * * *"

permissions:
  contents: write

concurrency:
  group: crime-scene-six-auto-clipper
  cancel-in-progress: false

jobs:
  snapshot-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_PATH: automation/clip_intel.db
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Register new Page videos
        run: python scripts/clip_intelligence.py sync

      - name: Pull Facebook retention snapshots
        run: python scripts/clip_intelligence.py snapshot

      - name: Retention report and learned guidelines
        run: |
          mkdir -p artifacts
          python scripts/clip_intelligence.py report | tee artifacts/retention_report.txt
          python scripts/clip_intelligence.py guidelines | tee -a artifacts/retention_report.txt

      - name: Save report
        uses: actions/upload-artifact@v4
        with:
          name: retention-report-${{ github.run_number }}
          path: artifacts/retention_report.txt
          retention-days: 30

      - name: Save retention database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f automation/clip_intel.db ]; then git add automation/clip_intel.db; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update retention database"
            git pull --rebase
            git push
          fi
